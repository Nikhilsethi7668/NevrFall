version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nevrfal-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Server Configuration
      - PORT=8080
      - NODE_ENV=production

      # MongoDB Atlas Connection
      - MONGO_URI=mongodb+srv://nevrfall:nevrfall@cluster0.mz1cqci.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0

      # JWT Secret (generate a strong random string)
      - JWT_SECRET=NEVRFALLnevrfall0099889900

      # Client URL (your frontend URL)
      - CLIENT_URL=http://66.94.120.78:3000
      - ADMIN_URL=http://66.94.120.78:5173

      # AWS S3 Configuration (if using file uploads)
      - AWS_ACCESS_KEY_ID=AKIA4DMVQXOOPR3APN6A
      - AWS_SECRET_ACCESS_KEY=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
      - AWS_REGION=eu-north-1
      - AWS_BUCKET_NAME=neverfall-image-bucket

      # Redis Cloud Configuration (requires TLS)
      - REDIS_HOST=redis-12821.c52.us-east-1-4.ec2.cloud.redislabs.com
      - REDIS_PORT=12821
      - REDIS_USERNAME=default
      - REDIS_PASSWORD=TWiJ3zzFnggUHmvBHrTJLX5Ie6Jy5Hvr
      - REDIS_TLS=false

      - DELHIVERY_TOKEN=5b0c262a84480f05e7f9124185f419d8d393da9f

      - EMAIL_SERVICE_API_KEY=re_gqkWstoN_LCZ16oHE72Bi724zrjRXnn7s
      - MOBILE_SERVICE_SECRET=0c89df6bbad34970

    networks:
      - nevrfal-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://66.94.120.78:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://66.94.120.78:8080}
    container_name: nevrfal-frontend
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://66.94.120.78:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nevrfal-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://66.94.120.78:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  nevrfal-network:
    driver: bridge
